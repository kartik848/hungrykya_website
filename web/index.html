<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="HungryKya — ghar jaisa khana, restaurant wala swaad. Order fresh food from our cloud kitchen. Pay by UPI or Cash on Delivery.">
  <meta name="theme-color" content="#FFFBF5">

  <meta property="og:title" content="HungryKya — Bhook lagi? Order now">
  <meta property="og:description" content="Fresh food from the HungryKya cloud kitchen, delivered hot. Pay by UPI or COD.">
  <meta property="og:image" content="icons/Icon-512.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HungryKya">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HungryKya — Bhook lagi? Order fresh food online</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFFBF5; }
    #hk-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(circle at 50% 40%, #FFE6BF 0%, #FFFBF5 62%);
      transition: opacity .4s ease;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #hk-splash img {
      width: 132px; height: 132px; border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(255,179,33,.18), 0 18px 60px rgba(184,92,0,.28);
      animation: hk-pulse 1.6s ease-in-out infinite;
    }
    #hk-splash .bar { width: 140px; height: 4px; border-radius: 4px; background: #F1E5D4; overflow: hidden; }
    #hk-splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #FFB321, #FF5A1F);
      animation: hk-load 1.1s ease-in-out infinite;
    }
    #hk-splash p { color: #85776A; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin: 0; }
    @keyframes hk-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes hk-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="hk-splash">
    <img src="icons/Icon-512.png" alt="HungryKya">
    <div class="bar"></div>
    <p>Garam khana aa raha hai…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('hk-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
